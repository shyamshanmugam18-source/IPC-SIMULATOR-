<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>HICC Command</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#0b1220;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#app{height:100%;display:flex;flex-direction:column}
.btn{border-bottom:4px solid rgba(0,0,0,.3);transition:.1s}.btn:active:not(:disabled){transform:translateY(3px);border-bottom-width:1px}
@keyframes pop{0%{transform:scale(.6);opacity:0}80%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}.pop{animation:pop .35s both}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}.shake{animation:shake .45s}
@keyframes pul{0%,100%{box-shadow:0 0 0 0 #2dd4bf}50%{box-shadow:0 0 0 8px rgba(45,212,191,0)}}.pulse{animation:pul .8s 3;outline:3px solid #2dd4bf}
@keyframes fl{0%,19%,22%,62%,64%,100%{opacity:1}20%,21%,63%{opacity:.2}}.neon{animation:fl 4s infinite}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}.slide{animation:up .4s both}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}.conf{position:fixed;top:-30px;font-size:22px;animation:fall 3s linear forwards;z-index:60}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;padding:8px 16px;border-radius:99px;font-weight:800;font-size:14px;color:#fff;pointer-events:none;transition:opacity .3s;opacity:0}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),M=()=>$('#main'),sh=a=>[...a].sort(()=>Math.random()-.5);
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ac,S,tt;
const snd=g=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),n=ac.createGain();o.connect(n);n.connect(ac.destination);o.type=g?'sine':'sawtooth';o.frequency.value=g?880:150;n.gain.setValueAtTime(.1,ac.currentTime);n.gain.exponentialRampToValueAtTime(.01,ac.currentTime+.3);o.start();o.stop(ac.currentTime+.3)}catch(e){}};
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
const toast=(t,bad)=>{const e=$('#toast');e.textContent=t;e.style.background=bad?'#e11d48':'#0d9488';e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,1100)};
const fresh=()=>({n:'',sc:0,inf:50,rep:50,combo:0,best:0,hints:3,mist:[],i:0,out:0,saved:0,t0:0});

const L=[
{t:'dlg',x:()=>`Welcome, MS ${S.n}. Infections are spreading through the wards. Form the HICC core team now.`,b:'Form Team'},
{t:'sort',ti:'Form the HICC Core Team',su:'Assign each person to their HICC role.',bins:[['ch','Chairperson','👑'],['ms','Member Secretary','📝'],['ico','Infection Control Officer','🔬'],['icn','IC Nurse','🩺']],items:[['🏥','Medical Superintendent','ch'],['🧫','HOD of Microbiology','ms'],['👨‍🏫','Professor of Microbiology','ico'],['👩‍⚕️','Senior IC Nurse','icn']]},
{t:'pick',ti:'Extended HICC Team',su:'Tap the 4 who belong. Wrong picks cost you.',o:[['HOD of All Depts',1],['BMW Supervisor',1],['CSSD Supervisor',1],['Biomedical Incharge',1],['Cafeteria Chef',0],['Security Guard',0],['Parking Attendant',0],['Librarian',0]]},
{t:'mcq',q:'Which is NOT a primary HICC role?',o:['Policy making','Surveillance','Direct patient surgery','Staff training'],a:2,w:'HICC frames policy, surveillance and training. It does not perform surgery.'},
{t:'dlg',x:()=>'Good. Hand hygiene is paramount. Complete the WHO 9-step sequence. Wrong step and you start again!',b:'Wash Hands'},
{t:'seq',ti:'Hand Hygiene: 9 Steps',su:'Tap the steps in WHO order.',it:[['🚰','Wet your hands'],['🧴','Soap'],['🙏','Palm to palm'],['🤚','Back to palm'],['🤝','Fingers interlaced'],['👆','Fingertips to opposite palm'],['🔒','Fingers interlocked'],['👍','Rotational thumb'],['💧','Rinse']],e:'Hand hygiene interrupted: wrong step order'},
{t:'mcq',q:'WHO recommended duration for an alcohol hand rub?',o:['10-15 s','20-30 s','40-60 s','1-2 min'],a:1,w:'Hand rub takes 20-30 s. Hand wash takes 40-60 s.'},
{t:'mcq',q:'How many "moments" of hand hygiene does WHO define?',o:['3','4','5','7'],a:2,w:'5 moments: before touching a patient, before clean/aseptic procedures, after body fluid exposure, after touching a patient, after touching patient surroundings.'},
{t:'dlg',x:()=>'Infectious agent suspected! Don your PPE, then doff it safely. One slip contaminates you.',b:'Enter Ward'},
{t:'seq',ti:'PPE Donning',su:'Put on in the WHO sequence.',it:[['🥼','Gown'],['😷','N95 Mask'],['🥽','Goggles'],['🧤','Gloves']],e:'PPE donning error: wrong sequence'},
{t:'seq',ti:'PPE Doffing',su:'Take off in the WHO sequence.',m:'rm',it:[['🧤','Gloves'],['🥽','Goggles'],['🥼','Gown'],['😷','N95 Mask']],e:'PPE doffing error: wrong sequence'},
{t:'mcq',q:'Why are gloves removed first when doffing?',o:['Easiest to pull off','Most heavily contaminated','To keep hands warm','It is optional'],a:1,w:'Gloves are the most contaminated item. Removing them first prevents transfer to face and body.'},
{t:'dlg',x:()=>'Waste is mixed up and CSSD needs items classified. Sort them out before the audit.',b:'Go to Triage'},
{t:'sort',ti:'Biomedical Waste Triage',su:'Pick the right colour-coded bin.',bins:[['yellow','Yellow: infectious','🟨'],['red','Red: contaminated plastics','🟥'],['white','White: sharps','⬜'],['blue','Blue: glass','🟦']],items:[['🩸','Blood-soaked cotton','yellow'],['🩹','Soiled dressing','yellow'],['💧','IV tubing','red'],['🧪','Used catheter bag','red'],['💉','Syringe needle','white'],['🧫','Broken ampoule','blue']]},
{t:'sort',ti:'Spaulding Classification',su:'How critical is the item?',bins:[['crit','Critical: sterilize','🔴'],['semi','Semi-critical: HLD','🟠'],['non','Non-critical: clean','🟢']],items:[['🔪','Surgical scalpel','crit'],['🦴','Bone implant','crit'],['📷','Flexible endoscope','semi'],['💪','BP cuff','non'],['🩺','Stethoscope','non']]},
{t:'dlg',x:()=>'CRITICAL ALERT! A large blood spill in the corridor. Manage it immediately.',b:'Manage Spill'},
{t:'seq',ti:'Large Blood Spill Protocol',su:'Exact sequence of actions.',it:[['🚧','Cordon area'],['🧤','Wear PPE'],['🧻','Absorbent cover'],['🧪','Apply 1% hypochlorite'],['⏳','Wait contact time'],['🗑️','Discard in yellow bag'],['🧹','Mop the area']],e:'Spill management error: wrong sequence'}
];

function upd(){if(!$('#iv'))return;$('#iv').textContent=Math.round(S.inf)+'%';$('#ib').style.width=S.inf+'%';$('#rv').textContent=Math.round(S.rep)+'%';$('#rb').style.width=S.rep+'%';$('#sv').textContent=S.sc;$('#cb').textContent=`Case ${Math.min(S.i+1,L.length)}/${L.length}`+(S.combo>1?`  ·  🔥 combo x${S.combo}`:'')}
function ok(b){S.combo++;S.best=Math.max(S.best,S.combo);const m=1+Math.min(S.combo-1,5)*.2,p=Math.round(b*m);S.sc+=p;S.inf=Math.max(0,S.inf-2);S.rep=Math.min(100,S.rep+2);snd(1);toast('+'+p+(S.combo>1?' 🔥 x'+m.toFixed(1):''));upd()}
function bad(msg,pen=15){S.combo=0;S.sc=Math.max(0,S.sc-pen);S.inf=Math.min(100,S.inf+7);S.rep=Math.max(0,S.rep-5);if(!S.mist.includes(msg))S.mist.push(msg);snd(0);vib(200);toast('-'+pen+'  '+msg.slice(0,34),1);const m=M();m.classList.remove('shake');void m.offsetWidth;m.classList.add('shake');upd();if(S.inf>=100){S.out=1;setTimeout(final,900)}}
function done(){const b=Math.max(0,Math.round(30-(Date.now()-S.t0)/1000));if(b>0){S.sc+=b;upd();setTimeout(()=>toast('⚡ Speed bonus +'+b),500)}setTimeout(next,1400)}
function next(){S.i++;go()}
const hintHtml=()=>`<button id="h" class="btn mt-4 mx-auto block px-4 py-2 rounded-xl bg-amber-500 text-slate-900 font-black text-sm">💡 Hint (${S.hints}) -5 pts</button>`;
function wire(cb){const h=$('#h');if(!h)return;h.onclick=()=>{if(S.hints<1)return toast('No hints left',1);S.hints--;S.sc=Math.max(0,S.sc-5);upd();h.textContent=`💡 Hint (${S.hints}) -5 pts`;cb()}}
const hdr=l=>`<h2 class="text-white text-xl font-black text-center">${l.ti}</h2><p class="text-slate-400 text-xs text-center mb-3">${l.su||''}</p>`;

function dlg(l){const t=l.x();let i=0,ty=1;M().innerHTML=`<div class="h-full flex flex-col justify-end p-3"><div class="bg-slate-800 border-2 border-slate-600 rounded-2xl p-4 relative slide"><div class="absolute -top-3 left-4 bg-teal-500 text-white text-xs font-black px-3 py-1 rounded-full">THE FOUNDER</div><div class="flex gap-3 mt-2"><div class="text-4xl">👩‍⚕️</div><p id="tx" class="text-slate-100 text-lg leading-relaxed min-h-[110px]"></p></div><button id="nx" class="btn hidden mt-3 w-full bg-teal-500 text-white font-black py-3 rounded-xl">${l.b} ➔</button></div></div>`;
const tx=$('#tx'),nx=$('#nx');const fin=()=>{clearInterval(tm);tx.textContent=t;ty=0;nx.classList.remove('hidden')};const tm=setInterval(()=>{tx.textContent=t.slice(0,++i);if(i>=t.length)fin()},25);M().onclick=()=>{if(ty)fin()};nx.onclick=e=>{e.stopPropagation();M().onclick=null;next()}}

function mcq(l){M().innerHTML=`<div class="max-w-xl mx-auto pop"><div class="text-amber-400 text-xs font-black text-center mb-2">🩺 CLINICAL CHECKPOINT</div><h3 class="text-white text-xl font-black text-center mb-4">${l.q}</h3><div id="ops" class="space-y-3">${l.o.map((x,i)=>`<button data-i="${i}" class="btn w-full text-left p-3 rounded-xl bg-slate-100 text-slate-800 font-bold"><span class="inline-block w-7 text-teal-700">${'ABCD'[i]}.</span>${x}</button>`).join('')}</div><div id="rs"></div></div>`;
let lk=0;document.querySelectorAll('#ops button').forEach(b=>b.onclick=()=>{if(lk)return;lk=1;const i=+b.dataset.i,c=$(`[data-i="${l.a}"]`);c.classList.add('!bg-teal-300');
if(i===l.a){ok(25);done()}else{b.classList.add('!bg-rose-300');bad(l.w,10);$('#rs').innerHTML=`<div class="mt-4 p-3 rounded-xl bg-rose-950 border border-rose-700 text-rose-200 text-sm slide">⚠️ ${l.w}<button id="c" class="btn mt-3 w-full bg-rose-600 text-white font-black py-2 rounded-xl">Acknowledge &amp; Continue</button></div>`;$('#c').onclick=next}})}

function seq(l){let p=0;const n=l.it.length,od=sh(l.it.map((x,i)=>i));
const draw=()=>{const w=l.it.filter((x,i)=>l.m==='rm'?i>=p:i<p);
M().innerHTML=`<div class="max-w-xl mx-auto">${hdr(l)}<div class="bg-slate-900 border border-slate-700 rounded-2xl p-3 mb-3 min-h-[80px] flex flex-wrap gap-2 justify-center items-center">${w.length?w.map(x=>`<span class="text-3xl pop" title="${x[1]}">${x[0]}</span>`).join(''):'<span class="text-slate-600 text-sm">Nothing yet…</span>'}</div><div class="text-center text-teal-400 text-xs font-bold mb-2">Step ${Math.min(p+1,n)} / ${n}</div><div class="grid grid-cols-3 gap-2">${od.map(i=>`<button data-i="${i}" ${i<p?'disabled':''} class="btn h-20 p-1 rounded-xl text-xs font-bold flex flex-col items-center justify-center gap-1 ${i<p?'bg-teal-600 text-white opacity-60':'bg-slate-100 text-slate-800'}"><span class="text-2xl">${l.it[i][0]}</span>${l.it[i][1]}</button>`).join('')}</div>${p<n?hintHtml():''}</div>`;
document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(i<p||p>=n)return;if(i===p){p++;ok(l.m?20:15);draw();if(p===n)done()}else{bad(l.e,20);p=0;draw()}});
wire(()=>$(`[data-i="${p}"]`).classList.add('pulse'))};draw()}

function srt(l){let k=0;const it=sh(l.items);
const draw=()=>{const c=it[k];M().innerHTML=`<div class="max-w-xl mx-auto">${hdr(l)}<div class="flex justify-center my-3 h-28">${c?`<div class="text-center pop"><div class="text-6xl">${c[0]}</div><div class="mt-2 font-black text-white bg-slate-800 rounded-xl px-4 py-1 border border-slate-600">${c[1]}</div></div>`:'<div class="text-5xl pop">✅</div>'}</div><div class="text-center text-xs text-slate-400 mb-2">${k} / ${it.length} sorted</div><div class="grid grid-cols-2 gap-2">${l.bins.map(b=>`<button data-b="${b[0]}" class="btn p-3 rounded-xl bg-slate-100 text-slate-800 font-bold text-sm flex flex-col items-center gap-1"><span class="text-3xl">${b[2]}</span>${b[1]}</button>`).join('')}</div>${c?hintHtml():''}</div>`;
document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{if(!c)return;if(b.dataset.b===c[2]){ok(20);k++;draw();if(k===it.length)done()}else{bad(`${c[1]} belongs to: ${l.bins.find(x=>x[0]===c[2])[1]}`,20)}});
wire(()=>c&&$(`[data-b="${c[2]}"]`).classList.add('pulse'))};draw()}

function pck(l){const g=new Set(),x=new Set(),need=l.o.filter(o=>o[1]).length;
const draw=()=>{M().innerHTML=`<div class="max-w-xl mx-auto">${hdr(l)}<div class="text-center text-teal-400 text-xs font-bold mb-3">${g.size} / ${need} found</div><div class="grid grid-cols-2 gap-3">${l.o.map((o,i)=>`<button data-i="${i}" class="btn p-4 rounded-xl font-bold ${g.has(i)?'bg-teal-300 text-teal-900':x.has(i)?'bg-rose-300 text-rose-900 opacity-70':'bg-slate-100 text-slate-800'}">${o[0]}</button>`).join('')}</div>${g.size<need?hintHtml():''}</div>`;
document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(g.has(i)||x.has(i)||g.size>=need)return;if(l.o[i][1]){g.add(i);ok(15);draw();if(g.size===need)done()}else{x.add(i);draw();bad(l.o[i][0]+' is not extended HICC',15)}});
wire(()=>{const i=l.o.findIndex((o,j)=>o[1]&&!g.has(j));$(`[data-i="${i}"]`).classList.add('pulse')})};draw()}

function go(){if(S.out||S.i>=L.length)return final();const l=L[S.i];S.t0=Date.now();upd();M().onclick=null;({dlg,mcq,seq,sort:srt,pick:pck})[l.t](l);M().scrollTop=0}

function intro(){$('#app').innerHTML=`<div class="h-full flex flex-col items-center justify-center text-center p-6 gap-5"><div class="text-6xl">🏥</div><h1 class="text-4xl font-black text-slate-100 tracking-widest uppercase">City Hospital</h1><div class="px-4 py-2 rounded-full bg-red-950 border border-red-500/50 text-red-400 font-bold text-sm neon">☣ BIOHAZARD DETECTED</div><p class="text-slate-400 text-sm max-w-xs">You are the new Medical Superintendent. Lead the HICC. Chain correct answers for combo points, beat the clock for speed bonuses, and keep infection below 100%.</p><button id="go" class="btn px-10 py-4 bg-teal-500 text-white font-black text-lg rounded-2xl">START INTERVENTION ➔</button></div>`;$('#go').onclick=()=>{snd(1);nameScr()}}
function nameScr(){S=fresh();$('#app').innerHTML=`<div class="h-full flex items-center justify-center p-5"><div class="bg-slate-100 p-6 rounded-3xl w-full max-w-sm pop"><h2 class="text-2xl font-black text-slate-800 text-center">ID Registration</h2><p class="text-slate-500 text-center text-sm mb-4">New Medical Superintendent appointed.</p><input id="ni" type="text" maxlength="18" autocomplete="off" autocapitalize="words" spellcheck="false" style="display:block;width:100%;box-sizing:border-box;padding:12px 14px;margin-bottom:12px;border-radius:12px;border:2px solid #94a3b8;background:#fff;color:#0f172a;font-size:18px;font-weight:700;-webkit-user-select:text;user-select:text;position:relative;z-index:5" placeholder="Dr. Name"><div class="flex flex-wrap gap-2 mb-4 justify-center"><button class="qn btn px-3 py-1 rounded-full bg-slate-300 text-slate-700 text-xs font-bold">Dr. Shyam</button><button class="qn btn px-3 py-1 rounded-full bg-slate-300 text-slate-700 text-xs font-bold">Dr. Anon</button></div><button id="ns" class="btn w-full py-3 bg-teal-500 text-white font-black rounded-xl">Sign Contract</button></div></div>`;
const f=()=>{const v=$('#ni').value.trim();if(!v)return toast('Type a name first',1);S.n=v;shell();go()};$('#ns').onclick=f;document.querySelectorAll('.qn').forEach(b=>b.onclick=()=>{$('#ni').value=b.textContent});setTimeout(()=>{try{$('#ni').focus()}catch(e){}},300);$('#ni').addEventListener('keydown',e=>{if(e.key==='Enter')f()})}
function shell(){$('#app').innerHTML=`<div class="p-2 bg-slate-900 border-b border-slate-700 text-white text-[11px] font-black"><div class="flex gap-2 items-center"><div class="flex-1"><div class="flex justify-between text-rose-400"><span>INFECTION</span><span id="iv"></span></div><div class="h-2 bg-slate-950 rounded-full overflow-hidden"><div id="ib" class="h-full bg-rose-500 transition-all duration-500"></div></div></div><div class="flex-1"><div class="flex justify-between text-blue-400"><span>REPUTATION</span><span id="rv"></span></div><div class="h-2 bg-slate-950 rounded-full overflow-hidden"><div id="rb" class="h-full bg-blue-500 transition-all duration-500"></div></div></div><div class="bg-teal-600 rounded-lg px-3 py-1 text-center"><div class="text-[9px] opacity-80">SCORE</div><div id="sv" class="text-base"></div></div></div><div id="cb" class="text-amber-400 text-center mt-1"></div></div><div id="main" class="flex-1 overflow-y-auto p-3"></div>`}

function final(){if(S.fin)return;S.fin=1;let lb=[];try{lb=JSON.parse(localStorage.getItem('hicc-lb')||'[]');if(!S.saved){lb.push({n:S.n,s:S.sc});lb.sort((a,b)=>b.s-a.s);lb=lb.slice(0,5);localStorage.setItem('hicc-lb',JSON.stringify(lb))}}catch(e){}S.saved=1;
const g=S.out?'F':S.inf<=15?'S':S.inf<=30?'A':S.inf<=50?'B':'C';
const bd=[S.best>=8&&['🔥','Streak Master'],S.hints===3&&['🧠','No Hints Used'],!S.mist.length&&['🏅','Flawless'],!S.out&&S.inf<=30&&['🛡️','Outbreak Contained']].filter(Boolean);
M().innerHTML=`<div class="max-w-xl mx-auto text-center pop"><div class="text-5xl">${S.out?'☣️':'🎖️'}</div><h2 class="text-2xl font-black text-white uppercase mt-2">${S.out?'Outbreak! Hospital Closed':'Final Report'}</h2><p class="text-teal-400 font-bold mb-4">MS ${E(S.n)}</p><div class="grid grid-cols-3 gap-2 mb-4"><div class="bg-slate-800 rounded-xl p-3"><div class="text-[10px] text-teal-400 font-black">SCORE</div><div class="text-2xl font-black text-white">${S.sc}</div></div><div class="bg-slate-800 rounded-xl p-3"><div class="text-[10px] text-rose-400 font-black">INFECTION</div><div class="text-2xl font-black text-rose-400">${Math.round(S.inf)}%</div></div><div class="bg-slate-800 rounded-xl p-3"><div class="text-[10px] text-amber-400 font-black">GRADE</div><div class="text-2xl font-black text-amber-400">${g}</div></div></div>${bd.length?`<div class="flex flex-wrap justify-center gap-2 mb-4">${bd.map(b=>`<span class="bg-slate-800 border border-amber-500/40 text-amber-300 text-xs font-bold px-3 py-1 rounded-full">${b[0]} ${b[1]}</span>`).join('')}</div>`:''}${S.mist.length?`<div class="bg-rose-950/50 border border-rose-900 rounded-xl p-3 mb-4 text-left"><div class="text-xs font-black text-rose-400 mb-1">REVISE THESE</div><ul class="text-xs text-rose-200 space-y-1">${S.mist.map(m=>`<li>• ${E(m)}</li>`).join('')}</ul></div>`:''}${lb.length?`<div class="bg-slate-800 rounded-xl p-3 mb-4 text-left"><div class="text-xs font-black text-white mb-1">🏆 TOP SCORES (this device)</div>${lb.map((e,i)=>`<div class="flex justify-between text-sm text-slate-200"><span>#${i+1} ${E(e.n)}</span><span class="text-teal-400 font-black">${e.s}</span></div>`).join('')}</div>`:''}<button id="re" class="btn w-full py-3 bg-teal-500 text-white font-black rounded-xl">PLAY AGAIN</button></div>`;
$('#re').onclick=nameScr;upd();if(!S.out)for(let i=0;i<30;i++){const c=document.createElement('span');c.className='conf';c.textContent=['🎉','✨','💉','🧼','🏅'][i%5];c.style.left=Math.random()*100+'vw';c.style.animationDelay=Math.random()*1.5+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),5000)}}
intro();
</script></body></html>
